name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.3', '7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          ini-values: memory_limit=512M

      # The plugin glue is PHP 7.3-clean; the 7.3 lint is the gate that keeps it so BEFORE core's
      # 7.3 re-floor (prerequisite C) lands. Runs on every matrix row.
      - name: Lint src for the target PHP
        run: |
          find src -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      # The bundled funnypot-core requires PHP >= 8.0 until prerequisite C re-floors it, so the full
      # composer install + unit suite runs on 8.x. On 7.3/7.4 the lint above is the gate.
      - name: Install (8.x only)
        if: ${{ matrix.php >= '8.0' }}
        run: composer install --no-interaction --no-progress

      - name: Unit suite (8.x only)
        if: ${{ matrix.php >= '8.0' }}
        run: vendor/bin/phpunit --testsuite unit
