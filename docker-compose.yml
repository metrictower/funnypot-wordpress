# funnypot-wordpress — LOCAL dev / install-smoke harness (FP-0497).
#
# Stands up real WordPress with this plugin live-mounted + activated, so you can browse to it,
# log in as admin, and see the Funnypot Settings / Honeypot Intel screens. It doubles as the
# "does the plugin cleanly install and run in stock WordPress?" smoke test.
#
#   docker compose up -d      # bring it up (first boot provisions WP + admin + activates the plugin)
#   open http://localhost:8919/wp-admin/   (admin / funnypot)
#   docker compose down       # stop   (add -v to also wipe the db + wp volumes)
#
# LOCAL-ONLY. The credentials below are dev conveniences, NOT secrets, and MUST NEVER be used for
# a real/internet-facing site. Non-standard host port (8919) so it won't collide with other stacks.
# The plugin is bind-mounted from this working tree (with its vendored funnypot-core/policy), so your
# edits are live — reload wp-admin to see them.

services:
  db:
    image: mariadb:11
    # No host port: the DB is reachable only from the wordpress/cli containers on the compose network.
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: funnypot
      MARIADB_ROOT_PASSWORD: funnypot-root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.5-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8919:80"          # NON-STANDARD host port (avoids collisions with other local stacks)
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: funnypot
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp_core:/var/www/html
      # Live-mount THIS plugin (incl. its vendored funnypot-core/policy) into wp-content/plugins.
      - ./:/var/www/html/wp-content/plugins/funnypot-wordpress

  # One-shot provisioner: waits for WP files, installs core, creates the admin, activates the plugin.
  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      wordpress:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: funnypot
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_core:/var/www/html
      - ./:/var/www/html/wp-content/plugins/funnypot-wordpress
      - ./docker/wp-init.sh:/wp-init.sh:ro
    # Run as the same uid the wordpress image serves under so wp-cli can read the mounted files.
    user: "33:33"
    entrypoint: ["bash", "/wp-init.sh"]

volumes:
  db_data:
  wp_core:
